#
# 用法：把这个文件的内容存为 awesome-dsh-plugin 仓库里的
#   data/plugins/NoCandles__dsh-stock-bar.yml
# 然后向 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin 提一个 PR。
# 规则见 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/blob/main/contributing.md
#
# 注意：
# - README 由脚本生成，**不要**手工编辑它们，只加这一个文件。
# - 仓库需要创建满 1 天才会通过 CI 的 repo-age 检查。
# - url 必须与仓库地址完全一致。
# - 描述更新时保持与 README 的功能列表一致；同花顺联动属于本地定制，不写进这里。

url: https://github.com/NoCandles/dsh-stock-bar
name: NoCandles/dsh-stock-bar
category: ui
description:
  en: 'Always-on quotes strip pinned to the top of the DSH window (folds into a titlebar capsule and queues with other top-bar plugins): watchlist and holdings with shares, cost and per-currency P&L, candlestick and intraday charts with MA, volume and crosshair, 5-level order book, trade ledger with realized P&L, and price alerts. AI review streams over selectable data packs (daily candles, intraday, multi-day money flow, ETF constituents, share creation and redemption), adds a verdict card with auto-set alerts, supports follow-up questions on a selected passage, and can run on a schedule. With dsh-better-sidebar installed the same dashboard also opens as a right-sidebar tab.'
  zh: '钉在 DSH 窗口顶部的常驻行情条（可折叠成标题栏胶囊，与其它顶栏插件自动排队）：自选与持仓（股数、成本、按币种分开的盈亏）、K 线与分时图（MA、成交量、十字光标、成本线）、五档盘口与委比、交易流水与已实现盈亏、价格预警。AI 复盘可选数据包（日K、分时、多日资金流、ETF 成分股、份额申赎），流式输出并附结论卡片、自动按关键价位设预警，可就选中段落追问，也能按时间点自动跟踪；装了 dsh-better-sidebar 时，同一套面板还能作为右侧栏「股票」页打开。'
